name: iOS Screenshot

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  screenshot:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode (latest stable with Swift 6.2+)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Install iOS simulator runtime
        run: |
          # List what runtimes are available
          xcrun simctl list runtimes
          # Install the latest iOS runtime if none present
          RUNTIME=$(xcrun simctl list runtimes | grep 'iOS' | grep -v 'unavailable' | tail -1)
          echo "Runtime: $RUNTIME"
          if [ -z "$RUNTIME" ]; then
            xcodebuild -downloadPlatform iOS
          fi

      - name: Pick simulator and build
        run: |
          # Find first available iPhone simulator UDID
          UDID=$(xcrun simctl list devices available | grep 'iPhone' | grep -v 'unavailable' | head -1 | grep -oE '[A-F0-9-]{36}')
          echo "Simulator UDID: $UDID"
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV

          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building $SCHEME in $WORKSPACE for $UDID"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath /tmp/DerivedData \
            -quiet \
            build

      - name: Boot simulator, install app, screenshot
        run: |
          APP=$(find /tmp/DerivedData -name "*.app" -not -path "*/PackageFrameworks/*" | head -1)
          echo "App: $APP"

          xcrun simctl boot "$SIM_UDID" || true
          sleep 6

          xcrun simctl install "$SIM_UDID" "$APP"
          xcrun simctl launch "$SIM_UDID" com.temple.siddur.trope
          sleep 8

          xcrun simctl io "$SIM_UDID" screenshot /tmp/screenshot-home.png
          echo "Screenshot saved."

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshot
          path: /tmp/screenshot-home.png
          retention-days: 14
