name: iOS Screenshot

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  screenshot:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode (latest stable with Swift 6.2+)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Install iOS simulator runtime
        run: |
          # List what runtimes are available
          xcrun simctl list runtimes
          # Install the latest iOS runtime if none present
          RUNTIME=$(xcrun simctl list runtimes | grep 'iOS' | grep -v 'unavailable' | tail -1)
          echo "Runtime: $RUNTIME"
          if [ -z "$RUNTIME" ]; then
            xcodebuild -downloadPlatform iOS
          fi

      - name: Pick simulator and build
        run: |
          # Find first available iPhone simulator UDID
          UDID=$(xcrun simctl list devices available | grep 'iPhone' | grep -v 'unavailable' | head -1 | grep -oE '[A-F0-9-]{36}')
          echo "Simulator UDID: $UDID"
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV

          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building $SCHEME in $WORKSPACE for $UDID"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath /tmp/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet \
            build

      - name: Install idb for UI automation
        run: pip3 install fb-idb

      - name: Boot simulator and install app
        run: |
          APP=$(find /tmp/DerivedData -name "*.app" -not -path "*/PackageFrameworks/*" | head -1)
          echo "App: $APP"
          xcrun simctl boot "$SIM_UDID" || true
          open -a Simulator --args -CurrentDeviceUDID "$SIM_UDID" || true
          sleep 6
          xcrun simctl install "$SIM_UDID" "$APP"

      - name: Start idb companion
        run: |
          idb_companion --udid "$SIM_UDID" --only-target 2>/tmp/idb.log &
          sleep 3
          idb connect "$SIM_UDID" || true

      - name: Launch app and click through to home screen
        run: |
          xcrun simctl launch "$SIM_UDID" com.temple.siddur.trope
          sleep 5

          # Screenshot 1: profile picker
          xcrun simctl io "$SIM_UDID" screenshot /tmp/ss1-picker.png

          # Tap "Add new profile" button (center-x=201, y≈190 in points)
          idb ui tap 201 190 --udid "$SIM_UDID"
          sleep 2

          # Screenshot 2: create profile screen
          xcrun simctl io "$SIM_UDID" screenshot /tmp/ss2-create.png

          # Tap the name input field (center, roughly y=200)
          idb ui tap 201 200 --udid "$SIM_UDID"
          sleep 0.5

          # Type a name
          idb ui text "Student" --udid "$SIM_UDID"
          sleep 0.5

          # Tap "Create profile" button (near bottom, y≈790)
          idb ui tap 201 790 --udid "$SIM_UDID"
          sleep 4

          # Screenshot 3: home screen
          xcrun simctl io "$SIM_UDID" screenshot /tmp/ss3-home.png
          echo "All screenshots saved."

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshot
          path: |
            /tmp/ss1-picker.png
            /tmp/ss2-create.png
            /tmp/ss3-home.png
          retention-days: 14
